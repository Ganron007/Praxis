<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-label="Praxis Security Architecture Diagram">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120726"/>
      <stop offset="50%" stop-color="#090314"/>
      <stop offset="100%" stop-color="#04010a"/>
    </linearGradient>

    <!-- Ambient Top Purple Glow -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c0f38"/>
      <stop offset="100%" stop-color="#0f0720"/>
    </linearGradient>

    <linearGradient id="cardCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1254"/>
      <stop offset="100%" stop-color="#14082c"/>
    </linearGradient>

    <linearGradient id="cardGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f3022"/>
      <stop offset="100%" stop-color="#061811"/>
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="glowCenter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#c084fc" flood-opacity="0.75"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrPurple" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c084fc"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1400" height="920" fill="url(#bgGrad)"/>
  <rect width="1400" height="400" fill="url(#topGlow)"/>

  <!-- ========================================================================= -->
  <!-- HEADER & LOGO                                                             -->
  <!-- ========================================================================= -->
  <g transform="translate(700, 52)">
    <!-- Shield Icon -->
    <g transform="translate(-290, -26) scale(0.38)">
      <path d="M55 0 L110 18 V62 C110 100 86 128 55 145 C24 128 0 100 0 62 V18 Z" fill="url(#purpleGrad)" stroke="#3b0764" stroke-width="3"/>
      <path d="M55 35 A35 35 0 1 1 20 70 H32 A23 23 0 1 0 55 47 V60 L75 41 L55 22 V35 Z" fill="#ffffff" opacity="0.95"/>
      <path d="M55 52 Q55 70 73 70 Q55 70 55 88 Q55 70 37 70 Q55 70 55 52 Z" fill="#ffffff" opacity="0.95"/>
    </g>
    <text x="-225" y="10" font-family="'Segoe UI', -apple-system, sans-serif" font-size="38" font-weight="900" fill="url(#purpleGrad)" letter-spacing="0.5">PRAXIS</text>
    <text x="-75" y="10" font-family="'Segoe UI', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="1">SECURITY ARCHITECTURE</text>
    <text x="0" y="42" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" font-weight="600" fill="#c084fc">
      Autonomous Find → Analyze → Fix &amp; Verify Closed-Loop Engine
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- TOP ROW: CLIENT INTERFACES & EXECUTION (y=120..185)                       -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <!-- 1. CLI -->
    <g>
      <rect x="0" y="0" width="300" height="64" rx="12" fill="url(#cardDark)" stroke="#4c1d95" stroke-width="1.8"/>
      <text x="20" y="28" font-family="sans-serif" font-size="17" font-weight="800" fill="#ffffff">&gt;_ Developer CLI &amp; REPL</text>
      <text x="20" y="49" font-family="sans-serif" font-size="14" font-weight="600" fill="#a855f7">`praxis scan` · `fix` · `redteam`</text>
    </g>

    <!-- 2. CI/CD -->
    <g transform="translate(325, 0)">
      <rect x="0" y="0" width="300" height="64" rx="12" fill="url(#cardDark)" stroke="#4c1d95" stroke-width="1.8"/>
      <text x="20" y="28" font-family="sans-serif" font-size="17" font-weight="800" fill="#ffffff">⚡ GitHub Action Gate</text>
      <text x="20" y="49" font-family="sans-serif" font-size="14" font-weight="600" fill="#a855f7">PR Diffs · SARIF · CI Blocking</text>
    </g>

    <!-- 3. MCP -->
    <g transform="translate(650, 0)">
      <rect x="0" y="0" width="300" height="64" rx="12" fill="url(#cardDark)" stroke="#4c1d95" stroke-width="1.8"/>
      <text x="20" y="28" font-family="sans-serif" font-size="17" font-weight="800" fill="#ffffff">🔌 MCP Server &amp; IDEs</text>
      <text x="20" y="49" font-family="sans-serif" font-size="14" font-weight="600" fill="#a855f7">Claude · Cursor · Windsurf</text>
    </g>

    <!-- 4. Dynamic Prober -->
    <g transform="translate(975, 0)">
      <rect x="0" y="0" width="305" height="64" rx="12" fill="url(#cardDark)" stroke="#4c1d95" stroke-width="1.8"/>
      <text x="20" y="28" font-family="sans-serif" font-size="17" font-weight="800" fill="#ffffff">🎯 Dynamic AI Red Teaming</text>
      <text x="20" y="49" font-family="sans-serif" font-size="14" font-weight="600" fill="#a855f7">Live API &amp; MCP Runtime DAST</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3 MAIN LARGE-TEXT PILLARS (y=210..790)                                    -->
  <!-- ========================================================================= -->

  <!-- ========================================================================= -->
  <!-- PILLAR 1: FIND (Audit & Threat Intel) (x=60, w=395)                       -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 210)" filter="url(#shadow)">
    <rect x="0" y="0" width="395" height="580" rx="18" fill="url(#cardDark)" stroke="#4c1d95" stroke-width="2.2"/>
    
    <!-- Stage Pill -->
    <rect x="20" y="20" width="120" height="34" rx="17" fill="#7c3aed"/>
    <text x="80" y="43" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="1">1 · FIND</text>
    <text x="150" y="44" font-family="sans-serif" font-size="22" font-weight="800" fill="#ffffff">Audit &amp; Detection</text>

    <!-- Block 1: Recon & Ingestion -->
    <g transform="translate(20, 72)">
      <rect x="0" y="0" width="355" height="110" rx="12" fill="#130724" stroke="#3b1d6e" stroke-width="1.4"/>
      <text x="16" y="28" font-family="sans-serif" font-size="17" font-weight="800" fill="#e879f9">Recon &amp; Tech-Stack</text>
      <text x="16" y="56" font-family="sans-serif" font-size="15" font-weight="600" fill="#e9d5ff">• Express, FastAPI, Django, Next.js</text>
      <text x="16" y="80" font-family="sans-serif" font-size="15" font-weight="600" fill="#e9d5ff">• API Endpoints, DBs &amp; Auth Flow</text>
      <text x="16" y="102" font-family="sans-serif" font-size="15" font-weight="600" fill="#e9d5ff">• IaC (Terraform, K8s, Docker)</text>
    </g>

    <!-- Block 2: 28 Parallel Agents -->
    <g transform="translate(20, 196)">
      <rect x="0" y="0" width="355" height="230" rx="12" fill="#130724" stroke="#3b1d6e" stroke-width="1.4"/>
      <text x="16" y="28" font-family="sans-serif" font-size="17" font-weight="800" fill="#e879f9">28 Parallel Security Agents</text>
      
      <text x="16" y="58" font-family="sans-serif" font-size="15" font-weight="700" fill="#f472b6">AI / LLM Threats (13)</text>
      <text x="24" y="80" font-family="sans-serif" font-size="14.5" fill="#e9d5ff">Prompt Injection · MCP Abuse · Pickles · RAG</text>

      <text x="16" y="112" font-family="sans-serif" font-size="15" font-weight="700" fill="#f472b6">Code &amp; Injection Sinks (4)</text>
      <text x="24" y="134" font-family="sans-serif" font-size="14.5" fill="#e9d5ff">SQLi · Command Exec · SSRF · XSS · ReDoS</text>

      <text x="16" y="166" font-family="sans-serif" font-size="15" font-weight="700" fill="#f472b6">Auth &amp; Governance (11)</text>
      <text x="24" y="188" font-family="sans-serif" font-size="14.5" fill="#e9d5ff">JWT · CSRF · IDOR · Typosquats · Secrets</text>
      <text x="24" y="210" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#facc15">Absence: No-Oversight · No-Observability</text>
    </g>

    <!-- Block 3: Threat Intel -->
    <g transform="translate(20, 440)">
      <rect x="0" y="0" width="355" height="118" rx="12" fill="#130724" stroke="#3b1d6e" stroke-width="1.4"/>
      <text x="16" y="28" font-family="sans-serif" font-size="17" font-weight="800" fill="#e879f9">Multi-Source Threat Intel</text>
      <text x="16" y="56" font-family="sans-serif" font-size="15" font-weight="700" fill="#c084fc">OSV · GHSA · CISA KEV · EPSS</text>
      <text x="16" y="80" font-family="sans-serif" font-size="15" font-weight="700" fill="#c084fc">NVD Database · 221 Gitleaks Rules</text>
      <text x="16" y="104" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399">✓ Offline-first local TTL cache</text>
    </g>
  </g>

  <!-- Conduit 1 -> 2 -->
  <line x1="455" y1="500" x2="495" y2="500" stroke="#c084fc" stroke-width="4" marker-end="url(#arrPurple)"/>

  <!-- ========================================================================= -->
  <!-- PILLAR 2: ANALYZE (AST Core, Standards & Deliverables) (x=505, w=430)     -->
  <!-- ========================================================================= -->
  <g transform="translate(505, 195)" filter="url(#glowCenter)">
    <rect x="0" y="0" width="430" height="610" rx="20" fill="url(#cardCenter)" stroke="#c084fc" stroke-width="2.6"/>
    
    <!-- Stage Pill -->
    <rect x="20" y="22" width="145" height="34" rx="17" fill="url(#purpleGrad)"/>
    <text x="92" y="45" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="1">2 · ANALYZE</text>
    <text x="180" y="46" font-family="sans-serif" font-size="22" font-weight="800" fill="#ffffff">AST Core &amp; Standards</text>

    <!-- Block 1: Pure ESM AST / CST Engine -->
    <g transform="translate(20, 72)">
      <rect x="0" y="0" width="390" height="155" rx="12" fill="#140626" stroke="#7c3aed" stroke-width="1.6"/>
      <text x="16" y="28" font-family="sans-serif" font-size="17" font-weight="800" fill="#e879f9">Pure ESM AST / CST &amp; Taint</text>
      <text x="16" y="56" font-family="sans-serif" font-size="15" font-weight="600" fill="#e9d5ff">• Babel Parser: JS, TS, JSX, TSX</text>
      <text x="16" y="80" font-family="sans-serif" font-size="15" font-weight="600" fill="#e9d5ff">• Python CST Tokenizer &amp; ScopeTree</text>
      <text x="16" y="104" font-family="sans-serif" font-size="15" font-weight="600" fill="#e9d5ff">• Source-to-Sink Taint Propagation</text>
      <text x="16" y="128" font-family="sans-serif" font-size="15" font-weight="600" fill="#e9d5ff">• Guardrails Filter: NeMo, LlamaGuard, Zod</text>
      <text x="16" y="146" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">✓ Active False-Positive Suppression</text>
    </g>

    <!-- Block 2: 0-100 Score & 8 Standards -->
    <g transform="translate(20, 240)">
      <rect x="0" y="0" width="390" height="165" rx="12" fill="#140626" stroke="#7c3aed" stroke-width="1.6"/>
      <text x="16" y="28" font-family="sans-serif" font-size="17" font-weight="800" fill="#e879f9">0–100 Score &amp; 8 Standards</text>
      <text x="16" y="56" font-family="sans-serif" font-size="15" font-weight="600" fill="#e9d5ff">• VerifierAgent + LLM DeepAnalyzer</text>
      <text x="16" y="80" font-family="sans-serif" font-size="15" font-weight="600" fill="#e9d5ff">• 0–100 Health Score (Grade A–F)</text>
      <text x="16" y="104" font-family="sans-serif" font-size="15" font-weight="700" fill="#c084fc">OWASP LLM · MITRE ATLAS · NIST AI</text>
      <text x="16" y="128" font-family="sans-serif" font-size="15" font-weight="700" fill="#c084fc">EU AI Act (18 Arts) · ISO 42001 · SAIF</text>
      <text x="16" y="152" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">✓ 3-State Gap Map (Flagged / Gap / Clear)</text>
    </g>

    <!-- Block 3: Multi-Format Deliverables -->
    <g transform="translate(20, 420)">
      <rect x="0" y="0" width="390" height="165" rx="12" fill="#140626" stroke="#7c3aed" stroke-width="1.6"/>
      <text x="16" y="28" font-family="sans-serif" font-size="17" font-weight="800" fill="#e879f9">Multi-Format Deliverables</text>
      <text x="16" y="56" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">📊 Interactive Pro HTML Report</text>
      <text x="16" y="80" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">🛡️ SARIF v2.1.0 (GitHub Code Scanning)</text>
      <text x="16" y="104" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">📦 CycloneDX 1.5 ABOM (Agent Manifest)</text>
      <text x="16" y="128" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">📑 Structured JSON &amp; GRC Mappings</text>
      <text x="16" y="152" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">✓ Zero Absolute System Path Leaks</text>
    </g>
  </g>

  <!-- Conduit 2 -> 3 -->
  <line x1="935" y1="500" x2="975" y2="500" stroke="#34d399" stroke-width="4" marker-end="url(#arrGreen)"/>

  <!-- ========================================================================= -->
  <!-- PILLAR 3: FIX & VERIFY (Closed-Loop Ladder) (x=985, w=355)                -->
  <!-- ========================================================================= -->
  <g transform="translate(985, 210)" filter="url(#shadow)">
    <rect x="0" y="0" width="355" height="580" rx="18" fill="url(#cardGreen)" stroke="#34d399" stroke-width="2.2"/>
    
    <!-- Stage Pill -->
    <rect x="20" y="20" width="165" height="34" rx="17" fill="url(#emeraldGrad)"/>
    <text x="102" y="43" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#042316" letter-spacing="1">3 · FIX &amp; VERIFY</text>
    <text x="195" y="44" font-family="sans-serif" font-size="22" font-weight="800" fill="#ffffff">Autonomous Fix</text>

    <!-- Block 1: LLM Planner & Human Gate -->
    <g transform="translate(20, 72)">
      <rect x="0" y="0" width="315" height="150" rx="12" fill="#061b11" stroke="#10b981" stroke-width="1.4"/>
      <text x="16" y="28" font-family="sans-serif" font-size="17" font-weight="800" fill="#6ee7b7">LLM Remediation Planner</text>
      <text x="16" y="56" font-family="sans-serif" font-size="15" font-weight="600" fill="#a7f3d0">• Context-Aware Multi-File Diffs</text>
      <text x="16" y="80" font-family="sans-serif" font-size="15" font-weight="600" fill="#a7f3d0">• Sibling Regression Test Synthesis</text>

      <!-- Human Gate Pill -->
      <rect x="12" y="94" width="291" height="44" rx="8" fill="#1f1807" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="22" y="116" font-family="sans-serif" font-size="14.5" font-weight="800" fill="#fde047">✋ Human-in-the-Loop Gate</text>
      <text x="22" y="132" font-family="sans-serif" font-size="13" fill="#fef08a">Interactive Diff Approval · `--auto-low`</text>
    </g>

    <!-- Block 2: 4-Tier Verification Ladder -->
    <g transform="translate(20, 234)">
      <rect x="0" y="0" width="315" height="205" rx="12" fill="#061b11" stroke="#10b981" stroke-width="1.4"/>
      <text x="16" y="28" font-family="sans-serif" font-size="17" font-weight="800" fill="#6ee7b7">4-Tier Verification Ladder</text>
      
      <!-- T0 -->
      <g transform="translate(14, 38)">
        <rect x="0" y="0" width="287" height="34" rx="6" fill="#0c2b1e"/>
        <text x="10" y="23" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">T0: AST Syntax Integrity Oracle</text>
      </g>
      <!-- T1 -->
      <g transform="translate(14, 76)">
        <rect x="0" y="0" width="287" height="34" rx="6" fill="#0c2b1e"/>
        <text x="10" y="23" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">T1: Native Project Build &amp; Lint</text>
      </g>
      <!-- T2 -->
      <g transform="translate(14, 114)">
        <rect x="0" y="0" width="287" height="34" rx="6" fill="#0c2b1e"/>
        <text x="10" y="23" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">T2: Unit &amp; Integration Tests</text>
      </g>
      <!-- T3 -->
      <g transform="translate(14, 152)">
        <rect x="0" y="0" width="287" height="34" rx="6" fill="#0c2b1e"/>
        <text x="10" y="23" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">T3: Target Re-scan Verification</text>
      </g>
      <text x="16" y="196" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#6ee7b7">✓ Auto-Revert on Exhaustion</text>
    </g>

    <!-- Block 3: Atomic Apply & Undo -->
    <g transform="translate(20, 452)">
      <rect x="0" y="0" width="315" height="106" rx="12" fill="#061b11" stroke="#10b981" stroke-width="1.4"/>
      <text x="16" y="28" font-family="sans-serif" font-size="17" font-weight="800" fill="#6ee7b7">Atomic Apply &amp; Undo Log</text>
      <text x="16" y="56" font-family="sans-serif" font-size="14.5" font-weight="600" fill="#a7f3d0">• Atomic Tempfile Replacement</text>
      <text x="16" y="78" font-family="sans-serif" font-size="14.5" font-weight="600" fill="#a7f3d0">• Audit Log: `.praxis/fixes.jsonl`</text>
      <text x="16" y="98" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#34d399">✓ Rollback: `praxis fix undo --all`</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CLOSED LOOP RETURN CONDUIT (Stage 3 back to Stage 1)                      -->
  <!-- ========================================================================= -->
  <path d="M 1162 790 C 1162 860 257 860 257 790" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#arrPurple)"/>
  <rect x="520" y="828" width="360" height="34" rx="17" fill="#180e2b" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="700" y="851" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#c084fc">↻ Continuous Watch &amp; Guard Loop</text>

  <!-- ========================================================================= -->
  <!-- FOOTER                                                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(700, 898)">
    <text text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#7c3aed">
      Single Binary (Node.js ≥ 18) · Pure ESM · Zero Build Step · Local-Only Execution · CADRE Platform Ecosystem
    </text>
  </g>
</svg>
